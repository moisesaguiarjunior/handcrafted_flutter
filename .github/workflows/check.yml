name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: cd example && flutter pub get --enforce-lockfile
      - run: bash tool/check.sh
      - run: python3 tool/check_publication.py
      - uses: actions/upload-artifact@v4
        with:
          name: library-coverage
          path: coverage/lcov.info
          if-no-files-found: error
  coverage:
    needs: package
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: library-coverage
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          flags: library
          name: flutter-library
          disable_search: true
          disable_telem: true
          cleanup: true
          use_oidc: true
          fail_ci_if_error: true
