name: handcrafted_example
description: Synthetic contour extraction example.
version: 0.0.1
publish_to: none
environment:
  sdk: '>=3.9.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  handcrafted_flutter:
    path: ../
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/layers/cabinet.png
    - assets/layers/placement-pebble.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
