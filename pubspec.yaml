name: handcrafted_flutter
description: Paper, fabric and EVA textures, contour stitches, watercolor, relief and finite motion around native Flutter widgets.
version: 0.4.0
repository: https://github.com/moisesaguiarjunior/handcrafted_flutter
homepage: https://moisesaguiarjunior.github.io/handcrafted_flutter/
issue_tracker: https://github.com/moisesaguiarjunior/handcrafted_flutter/issues
documentation: https://github.com/moisesaguiarjunior/handcrafted_flutter/blob/main/docs/README.md
topics:
  - widgets
  - animation
  - drawing
  - painting
  - materials
screenshots:
  - description: Layered watercolor pigment on seeded paper.
    path: doc/screenshots/watercolor-hero.png
  - description: An editable watercolor postcard with a stamp and native controls.
    path: doc/screenshots/painted-note.png
  - description: Native text, choices and actions in paper and cloth themes.
    path: doc/screenshots/material-vocabulary.png
  - description: A tooled leather journal, a raised balloon and a letterpress card.
    path: doc/screenshots/relief-objects.png
environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.7'
dependencies:
  clipper2: ^0.0.3
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
